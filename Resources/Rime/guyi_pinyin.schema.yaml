schema:
  schema_id: guyi_pinyin
  name: GuYi拼音
  version: "1.0"
switches:
  - name: ascii_mode
    reset: 0
  - name: simplification
    reset: 1
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - simplifier
    - uniquifier
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
translator:
  dictionary: luna_pinyin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
simplifier:
  opencc_config: t2s.json
  option_name: simplification
  tips: none
menu:
  page_size: 5
